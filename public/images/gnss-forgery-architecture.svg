<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="20" y="28" fill="#64748b" font-size="12">the pipeline, and where the forgery lives</text>

  <!-- ground truth -->
  <rect x="20" y="60" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="36" y="86" fill="#94a3b8" font-size="12">GNSS chip</text>
  <text x="36" y="104" fill="#64748b" font-size="11">ground truth</text>

  <!-- driver -->
  <rect x="210" y="60" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="226" y="86" fill="#94a3b8" font-size="12">kernel driver</text>
  <text x="226" y="104" fill="#64748b" font-size="11">chardev / QMI</text>

  <!-- forgery point -->
  <rect x="400" y="48" width="170" height="84" rx="8" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="416" y="74" fill="#f87171" font-size="12">★ forgery module</text>
  <text x="416" y="92" fill="#64748b" font-size="11">GKI .ko (Rust)</text>
  <text x="416" y="110" fill="#64748b" font-size="11">kprobe hook, fake NMEA</text>

  <!-- hal -->
  <rect x="610" y="60" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="86" fill="#94a3b8" font-size="12">HAL process</text>
  <text x="626" y="104" fill="#64748b" font-size="11">reads driver, unaware</text>

  <!-- framework -->
  <rect x="610" y="150" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="176" fill="#94a3b8" font-size="12">Framework</text>
  <text x="626" y="194" fill="#64748b" font-size="11">LocationManager</text>

  <!-- sdk -->
  <rect x="610" y="240" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="266" fill="#94a3b8" font-size="12">App SDK</text>
  <text x="626" y="284" fill="#64748b" font-size="11">AMap / Baidu / GMS</text>

  <!-- main flow arrows -->
  <line x1="170" y1="90" x2="205" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="90" x2="395" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="90" x2="605" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="685" y1="120" x2="685" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="685" y1="210" x2="685" y2="235" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- side observations the sdk also reads -->
  <text x="20" y="200" fill="#94a3b8" font-size="12">detectors the sdk also reads</text>
  <rect x="20" y="216" width="240" height="42" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="34" y="236" fill="#fbbf24" font-size="12">NMEA stream · raw GNSS measurements</text>
  <text x="34" y="252" fill="#64748b" font-size="11">forged at driver level → consistent ✓</text>
  <rect x="20" y="268" width="240" height="42" rx="6" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <text x="34" y="288" fill="#f87171" font-size="12">cell · wi-fi fingerprints</text>
  <text x="34" y="304" fill="#64748b" font-size="11">physical signals → cannot forge ✗</text>

  <!-- server -->
  <rect x="320" y="268" width="220" height="58" rx="8" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <text x="336" y="292" fill="#f87171" font-size="12">server-side fingerprint db</text>
  <text x="336" y="310" fill="#64748b" font-size="11">cross-validates observations</text>
  <line x1="440" y1="300" x2="605" y2="300" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
  <text x="470" y="290" fill="#64748b" font-size="11">the boundary</text>

  <!-- conclusion strip -->
  <text x="20" y="380" fill="#64748b" font-size="12">result: everything above the red module sees a self-consistent fake world. the red line is the</text>
  <text x="20" y="398" fill="#64748b" font-size="12">information-theoretic boundary — physical fingerprints and server authority survive any client forgery.</text>
</svg>
