<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="ui-monospace, Menlo, monospace" font-size="12">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="20" y="26" fill="#64748b">simulated with the real v6.1.1 weights: consecutive Good ratings on one card</text>

  <!-- bars: interval growth 2,11,46,163,496,1340,3272 (log scale visual) -->
  <!-- scale: log2(interval) mapped: 2d->h=30 ... 3272d->h=280 ; x step 110 -->
  <g>
    <rect x="60"  y="370" width="70" height="14" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="170" y="330" width="70" height="54" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="280" y="250" width="70" height="134" fill="#60a5fa" stroke="#2563eb"/>
    <rect x="390" y="150" width="70" height="234" fill="#3b82f6" stroke="#1d4ed8"/>
    <rect x="500" y="80"  width="70" height="304" fill="#2563eb" stroke="#1d4ed8"/>
    <rect x="610" y="40"  width="70" height="344" fill="#1d4ed8" stroke="#1e40af"/>
    <rect x="720" y="20"  width="70" height="364" fill="#1e40af" stroke="#1e3a8a"/>
  </g>

  <!-- value labels -->
  <g fill="#334155" text-anchor="middle">
    <text x="95"  y="364">2d</text>
    <text x="205" y="324">11d</text>
    <text x="315" y="244">46d</text>
    <text x="425" y="144">163d</text>
    <text x="535" y="74">496d</text>
    <text x="645" y="34">1340d</text>
    <text x="755" y="14">3272d ≈ 9 yr</text>
  </g>

  <!-- review number labels -->
  <g fill="#94a3b8" text-anchor="middle">
    <text x="95"  y="404">review 1</text>
    <text x="205" y="404">review 2</text>
    <text x="315" y="404">review 3</text>
    <text x="425" y="404">review 4</text>
    <text x="535" y="404">review 5</text>
    <text x="645" y="404">review 6</text>
    <text x="755" y="404">review 7</text>
  </g>

  <!-- stability annotation -->
  <text x="20" y="44" fill="#64748b">next interval (days) — S grows multiplicatively: each successful recall multiplies it by ~4x here</text>

  <!-- the catch annotation -->
  <text x="20" y="392" fill="#b91c1c"></text>
  <text x="430" y="428" fill="#64748b" text-anchor="middle">one lapse resets: S_new = min(w11·D^-w12·((S+1)^w13 − 1)·e^((1−r)·w14), S/e^(w17·w18)) — back to days, not weeks.</text>
</svg>
