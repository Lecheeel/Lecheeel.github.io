<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="ui-monospace, Menlo, monospace" font-size="12">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="20" y="26" fill="#64748b">the import pipeline — bytes to typed questions</text>

  <!-- stage boxes -->
  <g>
    <rect x="20" y="60" width="185" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="34" y="82" fill="#94a3b8">1 · unzip + pick db</text>
    <text x="34" y="102" fill="#64748b" font-size="11">ZipDecoder → prefer</text>
    <text x="34" y="118" font-size="11" fill="#64748b">anki21b &gt; anki21 &gt; anki2</text>

    <rect x="245" y="60" width="185" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="259" y="82" fill="#94a3b8">2 · sqlite readonly</text>
    <text x="259" y="102" fill="#64748b" font-size="11">extract to temp dir,</text>
    <text x="259" y="118" fill="#64748b" font-size="11">open read-only, SELECT flds</text>

    <rect x="470" y="60" width="175" height="90" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="484" y="82" fill="#94a3b8">3 · split fields</text>
    <text x="484" y="102" fill="#64748b" font-size="11">flds.split('\x1f')</text>
    <text x="484" y="118" fill="#64748b" font-size="11">&lt; 9 fields → skip+warn</text>

    <rect x="685" y="60" width="155" height="90" rx="8" fill="none" stroke="#818cf8" stroke-width="2"/>
    <text x="699" y="82" fill="#818cf8">4 · Question</text>
    <text x="699" y="102" fill="#64748b" font-size="11">typed model with</text>
    <text x="699" y="118" fill="#64748b" font-size="11">namespaced id</text>
  </g>
  <line x1="205" y1="105" x2="240" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="430" y1="105" x2="465" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="645" y1="105" x2="680" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- parsing details -->
  <rect x="20" y="190" width="400" height="215" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="36" y="214" fill="#8b5cf6">HTML field parsing (options)</text>
  <text x="36" y="238" fill="#64748b" font-size="11">primary regex: div.option &gt; span.option-label ([A-Z].) → text</text>
  <text x="36" y="258" fill="#64748b" font-size="11">fallback regex: lines like "A. text" / "B、text"</text>
  <text x="36" y="282" fill="#64748b" font-size="11">plain-text cleanup:</text>
  <text x="36" y="300" fill="#64748b" font-size="11">  br|p→\n · strip tags · decode entities (&amp;amp; &#x27;#x27; #hex)</text>
  <text x="36" y="318" fill="#64748b" font-size="11">  nbsp→space · collapse runs of whitespace</text>
  <text x="36" y="344" fill="#64748b" font-size="11">answer parse: extract [A-Z] letters ∩ option labels,</text>
  <text x="36" y="362" fill="#64748b" font-size="11">dedup, order-preserving → multi-select support</text>
  <text x="36" y="388" fill="#64748b" font-size="11">type inference: '多' in type OR len(answer)&gt;1 → multiple</text>

  <rect x="450" y="190" width="390" height="215" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="466" y="214" fill="#d97706">validation gates (skip + warn, max 10 warnings kept)</text>
  <text x="466" y="238" fill="#64748b" font-size="11">✗ fewer than 9 fields</text>
  <text x="466" y="258" fill="#64748b" font-size="11">✗ empty id / stem / options / answer</text>
  <text x="466" y="278" fill="#64748b" font-size="11">✗ answer references a label not in options</text>
  <text x="466" y="302" fill="#334155" font-size="11">id namespacing: "anki:&lt;deck&gt;:&lt;original-id&gt;" keeps</text>
  <text x="466" y="320" fill="#64748b" font-size="11">imported cards collision-free against native banks;</text>
  <text x="466" y="338" fill="#64748b" font-size="11">re-importing updates rows instead of duplicating.</text>
  <text x="466" y="366" fill="#334155" font-size="11">real-world check: 2026 politics 1000题 deck —</text>
  <text x="466" y="384" fill="#059669" font-size="11">1247 questions imported, 0 skipped, 477 single / 770 multiple.</text>
</svg>
