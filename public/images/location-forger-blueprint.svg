<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="20" y="26" fill="#64748b" font-size="12">design blueprint — control path (left) and data path (right)</text>

  <!-- APP -->
  <rect x="20" y="50" width="200" height="70" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="76" fill="#94a3b8" font-size="12">control app</text>
  <text x="36" y="94" fill="#64748b" font-size="11">map picker · route mode · on/off</text>
  <text x="36" y="110" fill="#64748b" font-size="11">(flutter / kotlin)</text>

  <!-- device node -->
  <rect x="20" y="160" width="200" height="60" rx="8" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <text x="36" y="184" fill="#818cf8" font-size="12">/dev/fakeloc</text>
  <text x="36" y="202" fill="#64748b" font-size="11">misc device · write/ioctl/poll</text>
  <line x1="120" y1="120" x2="120" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- kernel module -->
  <rect x="20" y="260" width="200" height="120" rx="8" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="284" fill="#f87171" font-size="12">forgery module (rust .ko)</text>
  <text x="36" y="304" fill="#64748b" font-size="11">· kprobe hook driver read()</text>
  <text x="36" y="322" fill="#64748b" font-size="11">· NMEA generator (GGA/RMC/GSV)</text>
  <text x="36" y="340" fill="#64748b" font-size="11">· kinematic engine (v/a clamps)</text>
  <text x="36" y="358" fill="#64748b" font-size="11">· QMI path (modern SoC)</text>
  <line x1="120" y1="220" x2="120" y2="255" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- data path -->
  <rect x="420" y="50" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="436" y="76" fill="#94a3b8" font-size="12">GNSS chip</text>
  <text x="436" y="94" fill="#64748b" font-size="11">ground truth</text>

  <rect x="610" y="50" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="76" fill="#94a3b8" font-size="12">kernel driver</text>
  <text x="626" y="94" fill="#64748b" font-size="11">chardev / QMI</text>

  <!-- hook point -->
  <circle cx="730" cy="120" r="16" fill="none" stroke="#f87171" stroke-width="2"/>
  <text x="722" y="125" fill="#f87171" font-size="14">⤳</text>
  <text x="600" y="145" fill="#f87171" font-size="11">kprobe here</text>

  <rect x="610" y="170" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="196" fill="#94a3b8" font-size="12">HAL process</text>
  <text x="626" y="214" fill="#64748b" font-size="11">reads fake stream, unaware</text>

  <rect x="610" y="270" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="296" fill="#94a3b8" font-size="12">Framework</text>
  <text x="626" y="314" fill="#64748b" font-size="11">LocationManager</text>

  <rect x="610" y="370" width="150" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="626" y="396" fill="#94a3b8" font-size="12">app sdk</text>
  <text x="626" y="414" fill="#64748b" font-size="11">amap / baidu / gms</text>

  <line x1="570" y1="80" x2="605" y2="80" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="685" y1="110" x2="685" y2="165" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="685" y1="230" x2="685" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="685" y1="330" x2="685" y2="365" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- link between module and driver -->
  <line x1="220" y1="320" x2="415" y2="120" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="248" y="235" fill="#f87171" font-size="11">module feeds fake stream into driver output</text>

  <!-- phases -->
  <text x="20" y="420" fill="#94a3b8" font-size="12">phases</text>
  <text x="20" y="440" fill="#64748b" font-size="11">1 · chardev device, static NMEA, verify GPS status changes</text>
  <text x="20" y="458" fill="#64748b" font-size="11">2 · kinematic engine, route mode, proper app</text>
  <text x="20" y="476" fill="#64748b" font-size="11">3 · QMI adapters, cell/wi-fi companion, open source</text>
</svg>
