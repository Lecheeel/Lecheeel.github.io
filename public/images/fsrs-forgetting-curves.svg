<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" font-family="ui-monospace, Menlo, monospace" font-size="12">
  <!-- background grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="400"/><line x1="80" y1="400" x2="800" y2="400"/>
    <line x1="80" y1="145" x2="800" y2="145" stroke-dasharray="4 4"/>
    <line x1="80" y1="250" x2="800" y2="250" stroke-dasharray="4 4"/>
    <line x1="80" y1="355" x2="800" y2="355" stroke-dasharray="4 4"/>
  </g>

  <!-- axes labels -->
  <text x="20" y="30" fill="#64748b">retrievability R</text>
  <text x="86" y="54" fill="#94a3b8">1.00</text>
  <text x="86" y="159" fill="#94a3b8">0.75</text>
  <text x="86" y="264" fill="#94a3b8">0.50</text>
  <text x="86" y="369" fill="#94a3b8">0.25</text>
  <text x="770" y="420" fill="#64748b">elapsed days</text>
  <text x="76" y="420" fill="#94a3b8">0</text>
  <text x="238" y="420" fill="#94a3b8">15</text>
  <text x="398" y="420" fill="#94a3b8">30</text>
  <text x="558" y="420" fill="#94a3b8">45</text>
  <text x="718" y="420" fill="#94a3b8">60</text>

  <!-- 90% retention line (request_retention = 0.9) -->
  <line x1="80" y1="184" x2="800" y2="184" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="700" y="176" fill="#d97706">R = 0.90 target</text>

  <!-- S=1 curve: r(t)=... sampled, scale: x = 80 + t*12, y = 400 - r*360 -->
  <path d="M 80,40 L 86,62 L 92,84 L 104,123 L 116,149 L 140,186 L 164,209 L 200,231 L 260,254 L 320,271 L 440,293 L 620,308 L 800,318"
        fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <text x="120" y="120" fill="#ef4444">S = 1 day</text>

  <!-- S=3 -->
  <path d="M 80,40 L 86,48 L 92,55 L 104,68 L 116,80 L 140,100 L 164,115 L 200,132 L 260,150 L 320,162 L 440,180 L 620,196 L 800,205"
        fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="300" y="130" fill="#8b5cf6">S = 3 days</text>

  <!-- S=10 -->
  <path d="M 80,40 L 86,43 L 92,47 L 104,53 L 116,58 L 140,66 L 164,72 L 200,79 L 260,88 L 320,94 L 440,103 L 620,113 L 800,119"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="480" y="88" fill="#2563eb">S = 10 days</text>

  <!-- S=30 -->
  <path d="M 80,40 L 86,42 L 92,44 L 104,46 L 116,48 L 140,51 L 164,53 L 200,56 L 260,61 L 320,64 L 440,70 L 620,77 L 800,82"
        fill="none" stroke="#059669" stroke-width="2.5"/>
  <text x="620" y="65" fill="#059669">S = 30 days</text>

  <!-- annotation: stability stretches the curve -->
  <text x="330" y="450" fill="#64748b">same decay shape; higher stability S stretches it horizontally.</text>
  <text x="330" y="468" fill="#64748b">the interval is where each curve crosses R = 0.90.</text>
</svg>
