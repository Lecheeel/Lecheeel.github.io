<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="ui-monospace, Menlo, monospace" font-size="12">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="20" y="26" fill="#64748b">what's actually inside a .apkg file</text>

  <!-- zip outer -->
  <rect x="20" y="44" width="820" height="300" rx="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="36" y="66" fill="#94a3b8">zip archive (.apkg)</text>

  <!-- media file -->
  <rect x="40" y="84" width="180" height="52" rx="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="54" y="106" fill="#94a3b8">media</text>
  <text x="54" y="124" fill="#64748b" font-size="11">JSON: name → filename</text>

  <!-- media dir -->
  <rect x="40" y="150" width="180" height="52" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="54" y="172" fill="#94a3b8">0, 1, 2, ...</text>
  <text x="54" y="190" fill="#64748b" font-size="11">renamed media assets</text>

  <!-- db priority -->
  <rect x="280" y="84" width="250" height="230" rx="8" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="296" y="108" fill="#2563eb">SQLite collection database</text>
  <text x="296" y="128" fill="#64748b" font-size="11">three possible names:</text>
  <rect x="296" y="142" width="218" height="40" rx="5" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="308" y="160" fill="#059669">collection.anki21b</text>
  <text x="308" y="176" fill="#64748b" font-size="11">new format (zstd-proto)</text>
  <rect x="296" y="192" width="218" height="40" rx="5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="308" y="210" fill="#8b5cf6">collection.anki21</text>
  <text x="308" y="226" fill="#64748b" font-size="11">legacy scheduler export</text>
  <rect x="296" y="242" width="218" height="56" rx="5" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="308" y="260" fill="#ef4444">collection.anki2 ⚠</text>
  <text x="308" y="276" fill="#64748b" font-size="11">old format — on new Anki</text>
  <text x="308" y="290" fill="#64748b" font-size="11">it's an upgrade PLACEHOLDER</text>

  <!-- notes table -->
  <rect x="600" y="84" width="220" height="230" rx="8" fill="none" stroke="#818cf8" stroke-width="2"/>
  <text x="616" y="108" fill="#818cf8">notes table</text>
  <text x="616" y="130" fill="#64748b" font-size="11">id · guid · mid · flds...</text>
  <rect x="616" y="146" width="188" height="120" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="628" y="168" fill="#334155" font-size="11">flds = field₁ \x1f field₂ \x1f ...</text>
  <text x="628" y="190" fill="#64748b" font-size="11">\x1f (unit separator) splits</text>
  <text x="628" y="208" fill="#64748b" font-size="11">9 fields for structured MCQ:</text>
  <text x="628" y="228" fill="#334155" font-size="11">id·no·section·type·question</text>
  <text x="628" y="246" fill="#334155" font-size="11">options·answer·analysis·tip</text>

  <!-- arrows -->
  <line x1="220" y1="110" x2="274" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="530" y1="200" x2="594" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- the trap note -->
  <text x="20" y="368" fill="#b91c1c">the trap: picking anki2 first reads a stub database with zero notes — the real data lives in anki21(b).</text>
</svg>
